<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Контакты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row">

        <!-- Боковое меню -->
        <div class="col-md-3 col-lg-2 d-none d-md-block bg-dark text-light position-fixed start-0 top-0 bottom-0 overflow-hidden">
            <div class="d-flex flex-column h-100">
                <!-- Заголовок + основные пункты -->
                <div class="p-4 pt-5">
                    <h4 class="text-center mb-5 text-info">Меню</h4>
                    <ul class="nav nav-pills flex-column gap-2">
                        <li class="nav-item"><a class="nav-link text-light" href="#">Главная</a></li>
                        <li class="nav-item"><a class="nav-link text-light" href="#">Каталог</a></li>
                        <li class="nav-item"><a class="nav-link text-light" href="#">Заказы</a></li>
                        <li class="nav-item"><a class="nav-link text-light <%= 'active bg-primary' if active == 'contacts' %>" href="#">Контакты</a></li>
                    </ul>
                </div>

                <!-- Пользователь — всегда внизу -->
                <div class="mt-auto px-4 pb-4">
                    <div class="dropdown">
                        <a class="d-flex align-items-center text-light text-decoration-none dropdown-toggle"
                           data-bs-toggle="dropdown" aria-expanded="false">
                            <div class="bg-secondary rounded-circle me-3 flex-shrink-0"
                                 style="width: 40px; height: 40px;"></div>
                            <div class="text-truncate">
                                <strong>Пользователь</strong>
                            </div>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark w-100">
                            <li><a class="dropdown-item" href="#">Профиль</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#">Выход</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-9 ms-md-auto col-lg-10 offset-lg-2 px-4 py-5">
            <h1 class="display-5 text-center mb-5 text-secondary">Контакты</h1>

            <div class="row g-5">
                <div class="col-lg-5">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <form method="POST">
                                <div class="mb-3">
                                    <input type="text" class="form-control" placeholder="Имя" name="name" required>
                                </div>
                                <div class="mb-3">
                                    <input type="email" class="form-control" placeholder="Почта" name="email" required>
                                </div>
                                <div class="mb-3">
                                    <textarea class="form-control" rows="5" placeholder="Сообщение" name="message" required></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary">Отправить</button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-lg-7">
                    <h3 class="mb-4">Наши контакты</h3>
                    <p class="text-muted">
                        Организация, которой не существует. Люди, которых нет
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
